[package]
name = "graphenium"
version = "0.25.0"
edition = "2021"
description = "Graphenium (gm) — relational codebase compiler and spec-driven containment engine for AI coding agents"
license = "MIT"
repository = "https://github.com/lambda-alpha-labs/Graphenium"
documentation = "https://github.com/lambda-alpha-labs/Graphenium"
readme = "README.md"
keywords = ["ai-agents", "mcp", "static-analysis", "datalog", "architecture"]
categories = ["development-tools", "command-line-utilities", "compilers"]

[[bin]]
name = "gm"
path = "src/main.rs"
required-features = ["mcp", "watch", "semantic"]

# Feature flags: enable/disable language support and optional subsystems.
# All 9 tree-sitter languages are included by default. Lean 4 support is
# always compiled in (pure Rust, no grammar feature flag).
[features]
default = [
    "mcp",
    "watch",
    "semantic",
    "lang-python",
    "lang-js",
    "lang-ts",
    "lang-rust",
    "lang-go",
    "lang-java",
    "lang-c",
    "lang-cpp",
    "lang-csharp",
]
# Compatibility marker for embedded harnesses. Use `default-features = false`
# to omit the MCP server, watch mode, and semantic HTTP client.
harness = []
mcp = ["watch", "dep:rmcp", "dep:arc-swap"]
watch = ["dep:notify", "dep:notify-debouncer-mini", "dep:tokio"]
semantic = ["dep:reqwest", "dep:tokio", "dep:base64"]
lang-python = ["dep:tree-sitter-python"]
lang-js     = ["dep:tree-sitter-javascript"]
lang-ts     = ["dep:tree-sitter-typescript"]
lang-rust   = ["dep:tree-sitter-rust"]
lang-go     = ["dep:tree-sitter-go"]
lang-java   = ["dep:tree-sitter-java"]
lang-c      = ["dep:tree-sitter-c"]
lang-cpp    = ["dep:tree-sitter-cpp"]
lang-csharp = ["dep:tree-sitter-c-sharp"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Graph
petgraph = "0.6"

# File walking (respects .gitignore/.grapheniumignore)
ignore = "0.4"
globset = "0.4"

# Concurrency: rayon for CPU-bound AST, tokio for async MCP/semantic I/O
rayon = "1"
tokio = { version = "1", features = ["full"], optional = true }

# HTTP client for Claude API calls (semantic feature)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# SHA256 hashing for cache keys
sha2 = "0.10"

# Error handling
thiserror = "1"
anyhow = "1"

# File watching (watch feature)
notify = { version = "6", optional = true }
notify-debouncer-mini = { version = "0.4", optional = true }

# AST parsing (Phase 3)
tree-sitter = "0.23"
tree-sitter-python     = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-rust       = { version = "0.23", optional = true }
tree-sitter-go         = { version = "0.23", optional = true }
tree-sitter-java       = { version = "0.23", optional = true }
tree-sitter-c          = { version = "0.23", optional = true }
tree-sitter-cpp        = { version = "0.23", optional = true }
# NOTE: tree-sitter-c-sharp may be at a different version than the others.
# Adjust if `cargo check` reports a resolution error for this crate.
tree-sitter-c-sharp    = { version = "0.23.1", optional = true }

# MCP Server (Phase 11) — official Rust MCP SDK
# NOTE: Verify the latest version at https://crates.io/crates/rmcp
rmcp = { version = "0.1", features = ["server", "transport-io", "macros"], optional = true }

# Base64 encoding for image content blocks in LLM requests (semantic feature)
base64 = { version = "0.22", optional = true }

# Regex (used in make_id and detection patterns)
regex = "1"

# Lazy static initialization for compiled regex sets
once_cell = "1"

# Hex encoding for SHA256 digests
hex = "0.4"

# Random number generation (used in Node2Vec random walks)
rand = "0.8"

# Lock-free atomic Arc swaps for the MCP server's hot-reloadable graph state.
arc-swap = { version = "1", optional = true }

# Incremental computation / demand-driven queries
salsa = "0.27"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
strip = "debuginfo"
opt-level = 3
