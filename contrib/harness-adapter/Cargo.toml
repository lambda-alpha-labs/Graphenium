[package]
name = "graphenium-harness-adapter"
version = "0.1.0"
edition = "2021"
description = "Reference adapter for embedding Graphenium in an AI coding harness"
license = "MIT"

[dependencies]
graphenium = { path = "../..", default-features = false, features = ["harness"] }

[features]
default = ["lang-python"]
lang-python = ["graphenium/lang-python"]

[dev-dependencies]
tempfile = "3"
